<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job - Recruiter - CVisionary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('recruiter.recruiter_dashboard') }}">Recruiter</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-danger btn-sm" href="{{ url_for('recruiter.recruiter_logout') }}">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('recruiter.recruiter_dashboard') }}">Overview</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('recruiter.recruiter_job_create') }}">New Job</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('recruiter.recruiter_jobs') }}">My Jobs</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('recruiter.recruiter_applications') }}">Applications</a>
        </li>
    </ul>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-3">Edit Job</h4>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" name="title" value="{{ job.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location" value="{{ job.location or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Skills</label>
                            <input type="text" class="form-control" name="skills" value="{{ job.skills or '' }}">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Experience</label>
                                <input type="text" class="form-control" name="experience" value="{{ job.experience or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Salary</label>
                                <input type="text" class="form-control" name="salary" value="{{ job.salary or '' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="5">{{ job.description or '' }}</textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">Save Changes</button>
                        <a class="btn btn-link" href="{{ url_for('recruiter.recruiter_jobs') }}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
